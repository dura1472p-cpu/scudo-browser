<script>
const T={"it": {"title": "Privacy Policy – Scudo Browser", "updated": "Ultimo aggiornamento: 27 settembre 2026", "intro": "Scudo Browser è un'estensione per Google Chrome progettata per proteggere l'accesso alla sessione di navigazione tramite una password configurata dall'utente.", "h1": "Dati e funzionamento locale", "p1": "Scudo Browser non invia allo sviluppatore password, cronologia di navigazione, contenuti dei siti web, posizione, dati finanziari o altre informazioni personali dell'utente.", "p2": "La password non viene memorizzata in chiaro. L'estensione elabora localmente i dati necessari alla verifica e memorizza sul dispositivo il derivato crittografico della password, il salt e le impostazioni necessarie alla protezione.", "h2": "Accesso alle schede del browser", "p3": "L'autorizzazione relativa alle schede è utilizzata esclusivamente per rilevare la creazione e l'aggiornamento delle schede e applicare la schermata di protezione quando la sessione è bloccata. Le informazioni di navigazione non vengono trasmesse allo sviluppatore o a server esterni.", "h3": "Condivisione e vendita dei dati", "p4": "Scudo Browser non vende dati degli utenti e non trasferisce dati a terze parti per pubblicità, profilazione, affidabilità creditizia o finalità estranee allo scopo dell'estensione.", "h4": "Supporto facoltativo", "p5": "L'estensione include un collegamento facoltativo a PayPal per sostenere il progetto. PayPal è un servizio esterno soggetto alle proprie condizioni e norme sulla privacy. Scudo Browser non riceve né memorizza nell'estensione dati di pagamento.", "h5": "Conservazione ed eliminazione", "p6": "Le impostazioni e i dati necessari alla verifica della password sono conservati localmente tramite le API di archiviazione di Chrome. La rimozione dell'estensione elimina i dati conservati nella sua area di archiviazione locale secondo il normale funzionamento di Chrome.", "h6": "Chrome Web Store – Limited Use", "p7": "L'uso delle informazioni ricevute dalle API di Google rispetta la Chrome Web Store User Data Policy, inclusi i requisiti di Limited Use. I dati accessibili all'estensione sono utilizzati esclusivamente per fornire la funzione di protezione descritta.", "h7": "Modifiche", "p8": "Questa informativa potrà essere aggiornata se cambiano le funzionalità o le modalità di trattamento dei dati. Questa pagina indicherà la data dell'ultimo aggiornamento.", "h8": "Contatti", "p9": "Per domande sulla privacy di Scudo Browser, utilizzare i recapiti dello sviluppatore indicati nella scheda del Chrome Web Store."}, "en": {"title": "Privacy Policy – Scudo Browser", "updated": "Last updated: September 27, 2026", "intro": "Scudo Browser is a Google Chrome extension designed to protect access to the browsing session with a password configured by the user.", "h1": "Data and local operation", "p1": "Scudo Browser does not send passwords, browsing history, website content, location, financial data, or other personal information to the developer.", "p2": "The password is not stored in plain text. The extension processes verification data locally and stores the password's cryptographic derivative, salt, and required protection settings on the device.", "h2": "Access to browser tabs", "p3": "The tabs permission is used only to detect tab creation and updates and to apply the protection screen while the session is locked. Browsing information is not transmitted to the developer or external servers.", "h3": "Data sharing and sale", "p4": "Scudo Browser does not sell user data and does not transfer user data to third parties for advertising, profiling, creditworthiness, or purposes unrelated to the extension's single purpose.", "h4": "Optional support", "p5": "The extension includes an optional PayPal link to support the project. PayPal is an external service subject to its own terms and privacy policy. Scudo Browser does not receive or store payment data inside the extension.", "h5": "Retention and deletion", "p6": "Settings and data required to verify the password are stored locally using Chrome storage APIs. Removing the extension deletes data stored in its local extension storage according to Chrome's normal behavior.", "h6": "Chrome Web Store – Limited Use", "p7": "Use of information received from Google APIs complies with the Chrome Web Store User Data Policy, including Limited Use requirements. Data accessible to the extension is used only to provide the described protection function.", "h7": "Changes", "p8": "This policy may be updated if features or data practices change. This page will show the date of the latest update.", "h8": "Contact", "p9": "For questions about Scudo Browser privacy, use the developer contact details shown on its Chrome Web Store listing."}, "fr": {"title": "Politique de confidentialité – Scudo Browser", "updated": "Dernière mise à jour : 27 septembre 2026", "intro": "Scudo Browser est une extension Google Chrome conçue pour protéger l'accès à la session de navigation à l'aide d'un mot de passe configuré par l'utilisateur.", "h1": "Données et fonctionnement local", "p1": "Scudo Browser n'envoie au développeur aucun mot de passe, historique de navigation, contenu de sites web, donnée de localisation, donnée financière ou autre information personnelle.", "p2": "Le mot de passe n'est pas stocké en clair. L'extension traite localement les données nécessaires à sa vérification et stocke sur l'appareil le dérivé cryptographique du mot de passe, le sel et les paramètres nécessaires à la protection.", "h2": "Accès aux onglets du navigateur", "p3": "L'autorisation relative aux onglets est utilisée uniquement pour détecter leur création et leur mise à jour et afficher l'écran de protection lorsque la session est verrouillée. Les informations de navigation ne sont pas transmises au développeur ni à des serveurs externes.", "h3": "Partage et vente des données", "p4": "Scudo Browser ne vend pas les données des utilisateurs et ne les transfère pas à des tiers à des fins publicitaires, de profilage, d'évaluation de solvabilité ou à des fins sans rapport avec l'objectif de l'extension.", "h4": "Soutien facultatif", "p5": "L'extension comprend un lien PayPal facultatif permettant de soutenir le projet. PayPal est un service externe soumis à ses propres conditions et politique de confidentialité. Scudo Browser ne reçoit ni ne stocke de données de paiement dans l'extension.", "h5": "Conservation et suppression", "p6": "Les paramètres et les données nécessaires à la vérification du mot de passe sont stockés localement via les API de stockage de Chrome. La suppression de l'extension efface les données de son stockage local conformément au fonctionnement normal de Chrome.", "h6": "Chrome Web Store – Limited Use", "p7": "L'utilisation des informations reçues des API Google respecte la Chrome Web Store User Data Policy, y compris les exigences de Limited Use. Les données accessibles à l'extension sont utilisées uniquement pour fournir la fonction de protection décrite.", "h7": "Modifications", "p8": "Cette politique peut être mise à jour si les fonctionnalités ou les pratiques de traitement des données changent. Cette page indiquera la date de la dernière mise à jour.", "h8": "Contact", "p9": "Pour toute question concernant la confidentialité de Scudo Browser, utilisez les coordonnées du développeur indiquées sur sa fiche Chrome Web Store."}, "de": {"title": "Datenschutzerklärung – Scudo Browser", "updated": "Zuletzt aktualisiert: 27. September 2026", "intro": "Scudo Browser ist eine Google-Chrome-Erweiterung, die den Zugriff auf die Browsersitzung mit einem vom Benutzer festgelegten Passwort schützt.", "h1": "Daten und lokale Verarbeitung", "p1": "Scudo Browser sendet keine Passwörter, Browserverläufe, Website-Inhalte, Standortdaten, Finanzdaten oder andere personenbezogene Informationen an den Entwickler.", "p2": "Das Passwort wird nicht im Klartext gespeichert. Die Erweiterung verarbeitet die zur Prüfung erforderlichen Daten lokal und speichert den kryptografischen Passwort-Ableitungswert, den Salt und die erforderlichen Schutzeinstellungen auf dem Gerät.", "h2": "Zugriff auf Browser-Tabs", "p3": "Die Tabs-Berechtigung wird ausschließlich verwendet, um das Erstellen und Aktualisieren von Tabs zu erkennen und bei gesperrter Sitzung den Schutzbildschirm anzuwenden. Browserinformationen werden nicht an den Entwickler oder externe Server übertragen.", "h3": "Weitergabe und Verkauf von Daten", "p4": "Scudo Browser verkauft keine Benutzerdaten und überträgt sie nicht zu Werbe-, Profiling-, Bonitäts- oder anderen zweckfremden Zwecken an Dritte.", "h4": "Freiwillige Unterstützung", "p5": "Die Erweiterung enthält einen optionalen PayPal-Link zur Unterstützung des Projekts. PayPal ist ein externer Dienst mit eigenen Bedingungen und Datenschutzbestimmungen. Scudo Browser empfängt oder speichert keine Zahlungsdaten innerhalb der Erweiterung.", "h5": "Speicherung und Löschung", "p6": "Einstellungen und die zur Passwortprüfung erforderlichen Daten werden lokal über die Chrome-Speicher-APIs gespeichert. Beim Entfernen der Erweiterung werden die Daten im lokalen Erweiterungsspeicher gemäß dem normalen Verhalten von Chrome gelöscht.", "h6": "Chrome Web Store – Limited Use", "p7": "Die Nutzung von Informationen aus Google-APIs entspricht der Chrome Web Store User Data Policy einschließlich der Limited-Use-Anforderungen. Zugängliche Daten werden ausschließlich für die beschriebene Schutzfunktion verwendet.", "h7": "Änderungen", "p8": "Diese Erklärung kann aktualisiert werden, wenn sich Funktionen oder Datenpraktiken ändern. Auf dieser Seite wird das Datum der letzten Aktualisierung angegeben.", "h8": "Kontakt", "p9": "Bei Fragen zum Datenschutz von Scudo Browser verwenden Sie die Entwickler-Kontaktdaten im Chrome Web Store."}, "es": {"title": "Política de privacidad – Scudo Browser", "updated": "Última actualización: 27 de septiembre de 2026", "intro": "Scudo Browser es una extensión para Google Chrome diseñada para proteger el acceso a la sesión de navegación mediante una contraseña configurada por el usuario.", "h1": "Datos y funcionamiento local", "p1": "Scudo Browser no envía al desarrollador contraseñas, historial de navegación, contenido de sitios web, ubicación, datos financieros ni otra información personal.", "p2": "La contraseña no se almacena en texto sin formato. La extensión procesa localmente los datos necesarios para verificarla y guarda en el dispositivo el derivado criptográfico de la contraseña, la sal y los ajustes necesarios para la protección.", "h2": "Acceso a las pestañas del navegador", "p3": "El permiso de pestañas se utiliza únicamente para detectar la creación y actualización de pestañas y aplicar la pantalla de protección cuando la sesión está bloqueada. La información de navegación no se transmite al desarrollador ni a servidores externos.", "h3": "Venta y transferencia de datos", "p4": "Scudo Browser no vende datos de los usuarios ni los transfiere a terceros con fines publicitarios, de perfilado, solvencia crediticia o para fines no relacionados con el propósito de la extensión.", "h4": "Apoyo opcional", "p5": "La extensión incluye un enlace opcional a PayPal para apoyar el proyecto. PayPal es un servicio externo sujeto a sus propias condiciones y política de privacidad. Scudo Browser no recibe ni almacena datos de pago dentro de la extensión.", "h5": "Conservación y eliminación", "p6": "Los ajustes y los datos necesarios para verificar la contraseña se almacenan localmente mediante las API de almacenamiento de Chrome. Al eliminar la extensión, se eliminan los datos de su almacenamiento local según el funcionamiento normal de Chrome.", "h6": "Chrome Web Store – Limited Use", "p7": "El uso de la información recibida de las API de Google cumple la Chrome Web Store User Data Policy, incluidos los requisitos de Limited Use. Los datos accesibles para la extensión se utilizan únicamente para proporcionar la función de protección descrita.", "h7": "Cambios", "p8": "Esta política puede actualizarse si cambian las funciones o las prácticas de tratamiento de datos. Esta página mostrará la fecha de la última actualización.", "h8": "Contacto", "p9": "Para preguntas sobre la privacidad de Scudo Browser, utiliza los datos de contacto del desarrollador indicados en su ficha de Chrome Web Store."}};
const select=document.getElementById('lang');
function render(lang){const x=T[lang]||T.en;document.documentElement.lang=lang;Object.keys(x).forEach(k=>{const e=document.getElementById(k);if(e)e.textContent=x[k];});select.value=lang;}
const detected=(navigator.language||'en').slice(0,2);render(T[detected]?detected:'en');
select.addEventListener('change',()=>render(select.value));
</script></body></html>
